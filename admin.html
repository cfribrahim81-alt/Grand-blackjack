<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grand Admin Control</title>
    <style>
        body { background: #050507; color: white; font-family: sans-serif; padding: 20px; }
        .request-card { background: #111; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-approve { background: #00a2ff; color: white; }
        .btn-delete { background: #ff4b5c; color: white; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>Grand Casino Admin</h1>
    <div id="auth-section">
        <input type="password" id="admin-pass" placeholder="Enter Admin Key">
        <button class="btn btn-approve" onclick="login()">Login</button>
    </div>
    <div id="admin-content" style="display:none;">
        <h3>Pending Requests</h3>
        <div id="list"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, set, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBG0AGTRFPXAObw0WYO8iiyLxJ80u3ot2o",
        authDomain: "grand-76631.firebaseapp.com",
        projectId: "grand-76631",
        databaseURL: "https://grand-76631-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.login = () => {
        if(document.getElementById('admin-pass').value === "davudənsevdiyimaddı") {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            loadReqs();
        } else { alert("Wrong Key!"); }
    };

    function loadReqs() {
        onValue(ref(db, 'requests'), (snap) => {
            const list = document.getElementById('list');
            list.innerHTML = "";
            snap.forEach(c => {
                const r = c.val();
                const div = document.createElement('div');
                div.className = "request-card";
                div.innerHTML = `
                    <strong>${r.type}</strong> | Amount: ${r.amt} | User: ${r.uid} <br>
                    <small>Addr: ${r.addr}</small><br><br>
                    <button class="btn btn-approve" onclick="approveReq('${c.key}','${r.uid}',${r.amt},'${r.type}')">APPROVE</button>
                    <button class="btn btn-delete" onclick="deleteReq('${c.key}')">DELETE</button>
                `;
                list.appendChild(div);
            });
        });
    }

    window.approveReq = async (key, uid, amt, type) => {
        const userRef = ref(db, `users/${uid}/balance`);
        const snap = await get(userRef);
        let b = snap.val() || 0;
        await set(userRef, type === 'DEP' ? b + amt : b - amt);
        await set(ref(db, `requests/${key}`), null);
        alert("Done!");
    };

    window.deleteReq = (key) => set(ref(db, `requests/${key}`), null);
</script>
</body>
</html>
